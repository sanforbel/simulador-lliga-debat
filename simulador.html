<!-- ===== FILE 2: simulador.html (UI nova del simulador) ===== -->
<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulador Lliga de Debat – Simulador</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-slate-900 text-white">
    <div class="max-w-5xl mx-auto px-4 py-6 flex items-center gap-3">
      <a href="./index.html" class="text-xl hover:underline">⟵ Portada</a>
      <div class="text-2xl">🎤</div>
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold">Simulador Lliga de Debat</h1>
        <p class="text-slate-300 text-sm">Recorda obrir en <span class="font-semibold">https</span> i permetre el <span class="font-semibold">micròfon</span>.</p>
      </div>
      <div class="ml-auto">
        <span id="micBadge" class="inline-flex items-center gap-1 rounded-full bg-emerald-600/20 text-emerald-700 px-3 py-1 text-sm">🟢 Micròfon: preparat</span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 grid gap-6">
    <!-- Roda de temes -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
      <div class="flex items-center justify-between gap-3 mb-4">
        <h2 class="text-xl sm:text-2xl font-bold">1) Roda de temes</h2>
        <button id="spin" class="inline-flex items-center gap-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2">🎲 Tema aleatori</button>
      </div>
      <p id="topic" class="text-lg text-slate-700">(prem el botó per a obtindre un tema)</p>
    </section>

    <!-- Intervenció -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
      <h2 class="text-xl sm:text-2xl font-bold mb-4">2) Intervenció</h2>

      <div class="grid gap-3">
        <textarea id="textInput" class="w-full min-h-[120px] rounded-xl border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="Escriu la teua intervenció..."></textarea>

        <div class="grid sm:grid-cols-[1fr_auto_auto] gap-3 items-center">
          <div class="flex items-center gap-3">
            <button id="recBtn" class="rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-semibold px-4 py-2">⏺️ Gravar</button>
            <button id="stopBtn" class="rounded-xl bg-slate-800/80 hover:bg-slate-900 text-white font-semibold px-4 py-2 disabled:opacity-40" disabled>⏹️ Parar</button>
          </div>
          <div class="justify-self-end text-sm text-slate-600 hidden sm:block" id="timer">00:00</div>
          <audio id="playback" controls class="w-full sm:w-[360px] justify-self-end"></audio>
        </div>
        <p id="micStatus" class="text-sm text-slate-500">Micròfon: preparat ✅</p>
      </div>
    </section>

    <!-- Autoavaluació -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xl sm:text-2xl font-bold">3) Autoavaluació (demo)</h2>
        <button id="evaluate" class="rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2">✅ Avalua</button>
      </div>
      <div id="result" class="grid gap-2"></div>
    </section>
  </main>

  <footer class="max-w-5xl mx-auto px-4 py-8 text-sm text-slate-500">
    © 2025 – UI Nova (Tailwind CDN)
  </footer>

  <script>
    // --- Temes ---
    const topics = [
      "La influència de les xarxes socials en l'educació",
      "És convenient prohibir els mòbils a l'aula?",
      "Canvi climàtic: accions individuals vs. polítiques públiques",
      "Intel·ligència artificial a l'escola: oportunitat o risc?",
      "Turisme de masses i sostenibilitat local"
    ];
    const spinBtn = document.getElementById('spin');
    const topicEl = document.getElementById('topic');
    spinBtn.addEventListener('click', () => { topicEl.textContent = 'Tema: ' + topics[Math.floor(Math.random()*topics.length)]; });

    // --- Gravació ---
    const recBtn = document.getElementById('recBtn');
    const stopBtn = document.getElementById('stopBtn');
    const playback = document.getElementById('playback');
    const micStatus = document.getElementById('micStatus');
    const micBadge = document.getElementById('micBadge');
    const timer = document.getElementById('timer');

    let mediaRecorder; let chunks = []; let isRecording = false; let tInt; let seconds = 0;
    function fmt(n){return (n<10?"0":"")+n}
    function startTimer(){ seconds = 0; timer.textContent = '00:00'; tInt = setInterval(()=>{ seconds++; timer.textContent = `${fmt(Math.floor(seconds/60))}:${fmt(seconds%60)}`; }, 1000); }
    function stopTimer(){ clearInterval(tInt); }

    async function askMic(){
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const options = { mimeType: 'audio/webm;codecs=opus' };
        mediaRecorder = new MediaRecorder(stream, options);
        mediaRecorder.ondataavailable = e => { if(e.data && e.data.size>0) chunks.push(e.data); };
        mediaRecorder.onstart = ()=>{ chunks = []; isRecording = true; startTimer(); };
        mediaRecorder.onstop = ()=>{
          isRecording = false; stopTimer();
          if (!chunks.length) { micStatus.textContent = "Micròfon: no s'ha capturat àudio. Parla 3–5 s."; return; }
          const blob = new Blob(chunks, { type: 'audio/webm' });
          playback.src = URL.createObjectURL(blob);
          playback.load();
          micStatus.textContent = 'Gravació parada. ▶️ Reproduïx l\'àudio';
        };
        micStatus.textContent = 'Micròfon: preparat ✅';
        recBtn.disabled = false; stopBtn.disabled = true;
      } catch(err){
        micStatus.textContent = 'Micròfon: error o permís denegat ❌ ('+err.name+')';
        recBtn.disabled = true; stopBtn.disabled = true;
      }
    }
    askMic();

    recBtn.addEventListener('click', ()=>{ if(!mediaRecorder || isRecording) return; try{ mediaRecorder.start(1000); recBtn.disabled = true; stopBtn.disabled = false; micStatus.textContent = 'Gravant… 🎙️ parla 3–5 s'; } catch(e){ micStatus.textContent = 'No s\'ha pogut iniciar la gravació ❌ ('+e.name+')'; }});
    stopBtn.addEventListener('click', ()=>{ if(!mediaRecorder || !isRecording) return; mediaRecorder.stop(); recBtn.disabled = false; stopBtn.disabled = true; });

    // --- Avaluació demo ---
    const evaluateBtn = document.getElementById('evaluate');
    const textInput = document.getElementById('textInput');
    const result = document.getElementById('result');
    function quickScore(txt){ const w = txt.trim().split(/\s+/).length; const hasConn = /(per tant|a més|d'una banda|de l'altra|en conclusió|no obstant)/i.test(txt); let s = 3; if(w>60) s+=2; if(hasConn) s+=3; return Math.min(10,s);}    
    evaluateBtn.addEventListener('click', ()=>{ let t = textInput.value; if(!t || t.length<10) t = 'Argument breu de prova.'; const s = quickScore(t); result.innerHTML = `<div class='grid gap-2 sm:grid-cols-2'><div class='rounded-xl border border-slate-200 p-4'><div class='text-2xl font-extrabold'>Puntuació: <span class='text-emerald-600'>${s}/10</span></div><div class='h-2 mt-3 w-full bg-slate-200 rounded-full overflow-hidden'><div class='h-full bg-emerald-600' style='width:${s*10}%'></div></div></div><ul class='rounded-xl border border-slate-200 p-4 list-disc list-inside text-slate-700'><li><strong>Tesi</strong> clara al principi.</li><li>Ús de <strong>connectors</strong> (per tant, a més...).</li><li><strong>Evidències</strong> / exemples concrets.</li><li>Final amb <strong>conclusió</strong>.</li></ul></div>`; });
  </script>
</body>
</html>
